<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proper Home Prep — Operations Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,500;1,600&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A; --gold:#D8B96A; --cream:#FAF7F2; --slate:#6B7D8F;
    --white:#FFFFFF; --ink:#2D2D2D; --urgent:#9B3A2E; --urgent-bg:#F4E3E0;
    --gold-bg:#F7EFDA; --slate-bg:#EBEEF1; --border:rgba(27,42,74,.14);
    --shadow:0 1px 2px rgba(27,42,74,.06), 0 6px 20px rgba(27,42,74,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream); color:var(--ink); font-family:'Lato',sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:'Playfair Display',serif; color:var(--navy); margin:0; font-weight:700;}
  h1{font-size:clamp(22px,4vw,32px);}
  h2{font-size:clamp(18px,3vw,22px);}
  h3.label{
    font-family:'Lato',sans-serif; font-size:12px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--slate); margin:0 0 10px;
  }
  .accent{font-family: 'Playfair Display', serif; font-style:italic; color:var(--navy);}
  p{margin:0 0 8px;}
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--gold); color:var(--navy);}

  /* ---------- App shell ---------- */
  #topbar{
    background:var(--navy); color:var(--white); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .wordmark{display:flex; flex-direction:column; line-height:1.1;}
  .wordmark .name{font-family:'Playfair Display',serif; font-weight:700; font-size:19px; letter-spacing:.02em;}
  .wordmark .tag{font-family: 'Playfair Display', serif; font-style:italic; font-size:12.5px; color:var(--gold); margin-top:2px;}
  .role-switch{display:flex; background:rgba(255,255,255,.08); border-radius:999px; padding:3px; gap:2px;}
  .role-switch button{
    border:none; background:transparent; color:rgba(255,255,255,.75); padding:8px 16px;
    border-radius:999px; font-size:13px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
    transition:.15s;
  }
  .role-switch button.active{background:var(--gold); color:var(--navy);}
  .subbar{
    background:var(--white); border-bottom:1px solid var(--border); padding:10px 20px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:60px; z-index:19;
  }
  .subbar .who{font-size:13px; color:var(--slate);}
  .subbar .who b{color:var(--navy);}
  .tabs{display:flex; gap:4px; flex-wrap:wrap;}
  .tabs button{
    border:1px solid transparent; background:transparent; color:var(--navy); padding:7px 14px;
    border-radius:8px; font-size:13.5px; font-weight:600;
  }
  .tabs button.active{background:var(--navy); color:var(--white);}
  .tabs button:not(.active):hover{background:var(--slate-bg);}
  #app-content{max-width:960px; margin:0 auto; padding:20px 20px 80px;}
  .link-btn{background:transparent; border:none; color:var(--navy); font-weight:600; padding:0; text-decoration:underline; font-size:13.5px;}
  .backlink{display:inline-flex; align-items:center; gap:6px; color:var(--slate); font-size:13px; font-weight:600; background:none; border:none; margin-bottom:14px; padding:0;}
  .backlink:hover{color:var(--navy);}

  /* ---------- Cards & bits ---------- */
  .card{
    background:var(--white); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .card.flush{padding:0; overflow:hidden;}
  .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .row.between{justify-content:space-between;}
  .grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:18px;}
  .stat{background:var(--white); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow);}
  .stat .num{font-family:'Playfair Display',serif; font-size:28px; color:var(--navy); font-weight:700;}
  .stat .lbl{font-size:12px; color:var(--slate); font-weight:600; text-transform:uppercase; letter-spacing:.06em;}

  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 10px; border-radius:999px;}
  .badge.not_started{background:var(--slate-bg); color:var(--slate);}
  .badge.in_progress{background:var(--gold-bg); color:#8a6d1f;}
  .badge.complete{background:var(--navy); color:var(--white);}
  .badge.q_new{background:var(--gold-bg); color:#8a6d1f;}
  .badge.q_contacted{background:var(--slate-bg); color:var(--slate);}
  .badge.q_qualified{background:var(--white); color:var(--navy); border:1.5px solid var(--navy);}
  .badge.q_converted{background:var(--navy); color:var(--white);}
  .badge.q_not_a_fit{background:var(--cream); color:var(--slate); border:1px dashed var(--slate);}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .dot.pulse{background:#D8B96A; animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,185,106,.5);}70%{box-shadow:0 0 0 7px rgba(216,185,106,0);}100%{box-shadow:0 0 0 0 rgba(216,185,106,0);}}

  .sev{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:3px 9px; border-radius:6px;}
  .sev.routine{background:var(--slate-bg); color:var(--slate);}
  .sev.attention{background:var(--gold-bg); color:#8a6d1f;}
  .sev.urgent{background:var(--urgent-bg); color:var(--urgent);}

  .btn{
    border-radius:9px; padding:10px 18px; font-weight:700; font-size:13.5px; border:1px solid transparent;
    letter-spacing:.02em; min-height:40px; display:inline-flex; align-items:center; gap:8px; justify-content:center;
  }
  .btn-primary{background:var(--navy); color:var(--white);}
  .btn-primary:hover{background:#233860;}
  .btn-gold{background:var(--gold); color:var(--navy);}
  .btn-gold:hover{background:#d9b95c;}
  .btn-outline{background:transparent; color:var(--navy); border-color:var(--navy);}
  .btn-outline:hover{background:var(--slate-bg);}
  .btn-danger{background:var(--white); color:var(--urgent); border-color:var(--urgent);}
  .btn-sm{padding:7px 12px; font-size:12.5px; min-height:32px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .task-row{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
  .task-row:last-child{border-bottom:none;}
  .task-check{
    width:22px; height:22px; border-radius:6px; border:2px solid var(--slate); flex:none; margin-top:1px;
    display:flex; align-items:center; justify-content:center; background:var(--white);
  }
  .task-check.done{background:var(--navy); border-color:var(--navy); color:var(--white); font-size:13px;}
  .task-text.done{text-decoration:line-through; color:var(--slate);}
  .task-meta{font-size:11.5px; color:var(--slate); margin-top:2px;}
  .section-hdr{
    font-family:'Lato',sans-serif; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--navy); background:var(--gold-bg); padding:7px 12px; border-radius:7px; margin:18px 0 4px;
  }
  .section-hdr:first-child{margin-top:0;}

  .thumb-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .thumb{width:64px; height:64px; border-radius:8px; object-fit:cover; border:1px solid var(--border);}
  .photo-slot{
    width:64px; height:64px; border-radius:8px; border:1.5px dashed var(--border); color:var(--slate);
    display:flex; align-items:center; justify-content:center; font-size:10px; text-align:center; cursor:pointer; background:var(--cream);
  }
  input[type=file]{display:none;}

  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-family:inherit;
    font-size:14px; background:var(--white); color:var(--ink);
  }
  label.field{display:block; font-size:12px; font-weight:600; color:var(--slate); text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px; margin-top:12px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}

  .empty{text-align:center; padding:40px 20px; color:var(--slate);}
  .empty .accent{font-size:20px; display:block; margin-bottom:6px;}

  .prop-tile{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); cursor:pointer;}
  .prop-tile:last-child{border-bottom:none;}
  .prop-tile:hover{background:var(--cream);}

  .flag-card{border-left:4px solid var(--slate); padding:10px 14px; margin-bottom:8px; background:var(--cream); border-radius:0 8px 8px 0;}
  .flag-card.attention{border-left-color:var(--gold);}
  .flag-card.urgent{border-left-color:var(--urgent);}

  .select-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px;}
  .select-card{background:var(--white); border:1px solid var(--border); border-radius:12px; padding:16px; text-align:left; box-shadow:var(--shadow);}
  .select-card:hover{border-color:var(--gold);}

  footer.note{max-width:960px; margin:0 auto; padding:0 20px 40px; font-size:11.5px; color:var(--slate); text-align:center;}
</style>
</head>
<body>
<div id="topbar">
  <div class="wordmark">
    <span class="name">PROPER HOME PREP</span>
    <span class="tag">Where Every Detail Matters</span>
  </div>
  <div class="role-switch" id="role-switch"></div>
</div>
<div class="subbar" id="subbar"></div>
<div id="app-content"></div>
<footer class="note">Prototype build · data stored locally in this browser · designed to migrate cleanly to Firestore</footer>

<script>
/* =========================================================================
   PROPER HOME PREP — OPERATIONS DASHBOARD (prototype)
   Three role views over one data model: Admin, Tech, Client.
   DB layer is localStorage-backed today; every call is isolated behind
   the DB object below so swapping to Firestore later means rewriting
   this block only — no view code changes.
   ========================================================================= */

/* ---------------------------- DB LAYER ---------------------------- */
const DB_KEY = 'phpDashboardDB_v1';

const DB = {
  _read(){ return JSON.parse(localStorage.getItem(DB_KEY)); },
  _write(data){ localStorage.setItem(DB_KEY, JSON.stringify(data)); },

  getProperties(){ return this._read().properties; },
  getProperty(id){ return this._read().properties.find(p => p.id === id); },
  saveProperty(prop){
    const d = this._read();
    const i = d.properties.findIndex(p => p.id === prop.id);
    if (i > -1) d.properties[i] = prop; else d.properties.push(prop);
    this._write(d);
  },

  getTechs(){ return this._read().techs; },
  getTech(id){ return this._read().techs.find(t => t.id === id); },
  addTech(name){
    const d = this._read();
    const tech = { id: 'te' + Date.now(), name };
    d.techs.push(tech);
    this._write(d);
    return tech;
  },

  getJobs(filter){
    let jobs = this._read().jobs;
    if (filter) {
      if (filter.techId) jobs = jobs.filter(j => j.techId === filter.techId);
      if (filter.propertyId) jobs = jobs.filter(j => j.propertyId === filter.propertyId);
      if (filter.status) jobs = jobs.filter(j => j.status === filter.status);
    }
    return jobs.sort((a,b) => (b.scheduledDate||'').localeCompare(a.scheduledDate||''));
  },
  getJob(id){ return this._read().jobs.find(j => j.id === id); },
  _saveJob(job){
    const d = this._read();
    const i = d.jobs.findIndex(j => j.id === job.id);
    d.jobs[i] = job;
    this._write(d);
  },

  // Snapshot the property's live SOP template into a new job at creation time,
  // so later edits to the property's SOP never retroactively alter past jobs.
  createJob({propertyId, techId, type, scheduledDate}){
    const d = this._read();
    const prop = d.properties.find(p => p.id === propertyId);
    const tasks = JSON.parse(JSON.stringify(prop.sopTemplate)).map((t,idx) => ({
      ...t, id: 't' + Date.now() + idx, done:false, doneAt:null, photoBefore:null, photoAfter:null
    }));
    const job = {
      id: 'j' + Date.now(),
      propertyId, techId, type, scheduledDate,
      status: 'not_started',
      clockIn:null, clockOut:null,
      laundryStarted:false,
      beforePhotos:{}, afterPhotos:{},
      tasks,
      issueFlags: [],
      completionReport: null,
      createdAt: new Date().toISOString()
    };
    d.jobs.push(job);
    this._write(d);
    return job;
  },

  clockIn(jobId){
    const job = this.getJob(jobId);
    job.clockIn = new Date().toISOString();
    job.status = 'in_progress';
    this._saveJob(job);
  },
  toggleLaundry(jobId){
    const job = this.getJob(jobId);
    job.laundryStarted = !job.laundryStarted;
    this._saveJob(job);
  },
  setAreaPhoto(jobId, area, phase, dataUrl){
    const job = this.getJob(jobId);
    (phase==='before' ? job.beforePhotos : job.afterPhotos)[area] = dataUrl;
    this._saveJob(job);
  },
  toggleTask(jobId, taskId){
    const job = this.getJob(jobId);
    const t = job.tasks.find(x => x.id === taskId);
    t.done = !t.done;
    t.doneAt = t.done ? new Date().toISOString() : null;
    if (job.status === 'not_started' && t.done) job.status = 'in_progress';
    this._saveJob(job);
  },
  addPhoto(jobId, taskId, kind, dataUrl){
    const job = this.getJob(jobId);
    const t = job.tasks.find(x => x.id === taskId);
    if (kind === 'before') t.photoBefore = dataUrl; else t.photoAfter = dataUrl;
    this._saveJob(job);
  },
  addIssueFlag(jobId, {severity, description, photoDataUrl}){
    const job = this.getJob(jobId);
    job.issueFlags.push({
      id:'f'+Date.now(), severity, description, photo:photoDataUrl||null,
      createdAt:new Date().toISOString()
    });
    this._saveJob(job);
  },
  submitSignOff(jobId, {notes}){
    const job = this.getJob(jobId);
    job.clockOut = new Date().toISOString();
    job.status = 'complete';
    job.completionReport = {
      signOffAt: new Date().toISOString(),
      notes: notes||'',
      photoCount: job.tasks.filter(t=>t.photoBefore||t.photoAfter).length + Object.keys(job.beforePhotos).length + Object.keys(job.afterPhotos).length,
      flagCount: job.issueFlags.length
    };
    this._saveJob(job);
  },

  /* ---- Inquiries (lead pipeline). Older saved data has no `inquiries` key, so every read defaults to []. ---- */
  getInquiries(){ return (this._read().inquiries || []).slice().sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')); },
  getInquiry(id){ return (this._read().inquiries || []).find(q => q.id === id); },
  addInquiry(q){
    const d = this._read();
    d.inquiries = d.inquiries || [];
    const now = new Date().toISOString();
    const inq = {
      id: 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      referenceId: 'INQ-' + Math.random().toString(36).slice(2,7).toUpperCase(),
      status: 'new', followUp: '', propertyId: null, createdAt: now,
      log: [{at: now, kind:'status', text: 'Inquiry received' + (q.source ? ' via ' + q.source : '')}],
      ...q
    };
    d.inquiries.push(inq);
    this._write(d);
    return inq;
  },
  _saveInquiry(inq){
    const d = this._read();
    const i = (d.inquiries || []).findIndex(x => x.id === inq.id);
    if (i < 0) return;
    d.inquiries[i] = inq;
    this._write(d);
  },
  setInquiryStatus(id, status){
    const q = this.getInquiry(id);
    if (!q || q.status === status) return;
    q.status = status;
    q.log.push({at:new Date().toISOString(), kind:'status', text:'Status → ' + INQ_LABELS[status]});
    this._saveInquiry(q);
  },
  addInquiryNote(id, text){
    const q = this.getInquiry(id);
    if (!q) return;
    q.log.push({at:new Date().toISOString(), kind:'note', text});
    this._saveInquiry(q);
  },
  setInquiryFollowUp(id, date){
    const q = this.getInquiry(id);
    if (!q || (q.followUp || '') === date) return;
    q.followUp = date;
    q.log.push({at:new Date().toISOString(), kind:'status', text: date ? 'Follow-up set for ' + fmtDate(date) : 'Follow-up cleared'});
    this._saveInquiry(q);
  },
  linkInquiryToProperty(id, propertyId, nickname){
    const q = this.getInquiry(id);
    if (!q) return;
    q.status = 'converted';
    q.propertyId = propertyId;
    q.log.push({at:new Date().toISOString(), kind:'status', text:'Converted — property created: ' + nickname});
    this._saveInquiry(q);
  },

  resetDemo(){ localStorage.removeItem(DB_KEY); seed(); }
};

/* ---------------------------- SEED DATA ---------------------------- */
function buildSopTemplate(bedroomCount, hasOutdoor){
  const bath = ['Clean and disinfect toilet','Clean tub / shower and glass','Clean mirror and vanity',
    'Restock toiletries and fresh towels','Mop floor']
    .map(label => ({section:'Bathrooms', label}));
  const kitchen = ['Wipe all countertops and backsplash','Clean stovetop — all burners and grates',
    'Wipe microwave interior and exterior','Clean refrigerator exterior; wipe interior shelves',
    'Empty and reline trash cans; replace bags','Run and empty dishwasher; put away all clean dishes',
    'Clean sink and faucet; polish if stainless','Mop / sanitize floor',
    'Check and restock supplies per host restocking list','Final smell check — no odors']
    .map(label => ({section:'Kitchen', label}));
  const living = ['Dust all surfaces — shelves, TV stand, décor, fixtures','Wipe down and sanitize all remote controls',
    'Straighten and fluff all cushions and throw pillows','Vacuum all furniture — sofa, chairs, ottomans',
    'Vacuum and / or mop floors','Clean glass surfaces per host instructions',
    'Check for items left behind by previous guests','Check and replace lightbulbs if needed',
    'Final staging check — matches host welcome photo']
    .map(label => ({section:'Living Room', label}));
  const bedrooms = [];
  for (let i=1; i<=bedroomCount; i++){
    ['Strip all used linens and pillowcases','Check mattress protector — clean or replace if soiled',
     'Make bed with fresh linens','Fluff and arrange pillows per host preference',
     'Dust all surfaces — nightstands, dresser, lamps','Check under bed and closet for guest items',
     'Vacuum or mop floors','Final staging check — matches host welcome photo']
      .forEach(label => bedrooms.push({section:'Bedroom '+i, label}));
  }
  const outdoor = hasOutdoor ? ['Sweep porch / patio / deck','Wipe down outdoor furniture',
    'Check grill (if provided) and reset','Reset outdoor staging per host photos']
    .map(label => ({section:'Outdoor', label})) : [];
  return [...bath, ...kitchen, ...living, ...bedrooms, ...outdoor];
}

// Whole-room before/after photo checkpoints — matches the field guide's
// arrival and final-walkthrough photo requirements, independent of task list.
function propertyAreas(prop){
  const areas = ['Exterior'];
  for (let i=1; i<=prop.bathrooms; i++) areas.push('Bathroom '+i);
  areas.push('Kitchen','Living Room');
  for (let i=1; i<=prop.bedrooms; i++) areas.push('Bedroom '+i);
  if (prop.hasOutdoor) areas.push('Outdoor');
  return areas;
}
function placeholderPhoto(label){
  const c = document.createElement('canvas'); c.width=160; c.height=110;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1B2A4A'; ctx.fillRect(0,0,160,110);
  ctx.fillStyle = '#D8B96A'; ctx.font='12px Lato, sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, 80, 59);
  return c.toDataURL('image/png');
}

  const properties = [

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function fmtDateTime(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

/* ---------------------------- STATE ---------------------------- */
let state = {
  role: 'admin',
  admin: { view:'overview', propertyId:null, jobId:null, inquiryId:null, inquiryFilter:'all', inquirySearch:'', convertingInquiryId:null },
  tech: { techId:null, view:'myjobs', jobId:null },
  client: { propertyId:null, view:'current', jobId:null }
};

function setRole(role){ state.role = role; render(); }

/* ---------------------------- RENDER: SHELL ---------------------------- */
function render(){
  renderRoleSwitch();
  renderSubbar();
  const app = document.getElementById('app-content');
  if (state.role === 'admin') app.innerHTML = renderAdmin();
  else if (state.role === 'tech') app.innerHTML = renderTech();
  else app.innerHTML = renderClient();
}

function renderRoleSwitch(){
  const roles = [['admin','Admin'],['tech','Tech'],['client','Client']];
  document.getElementById('role-switch').innerHTML = roles.map(([key,label]) =>
    `<button class="${state.role===key?'active':''}" onclick="setRole('${key}')">${label}</button>`
  ).join('');
}

function renderSubbar(){
  const sb = document.getElementById('subbar');
  if (state.role === 'admin'){
    const newInq = DB.getInquiries().filter(q => q.status === 'new').length;
    const tabs = [['overview','Overview'],['inquiries','Inquiries' + (newInq ? ' (' + newInq + ')' : '')],['properties','Properties'],['jobs','Job Board'],['techs','Techs'],['resources','Resources']];
    sb.innerHTML = `<div class="tabs">${tabs.map(([k,l]) =>
      `<button class="${state.admin.view===k?'active':''}" onclick="setAdminView('${k}')">${l}</button>`).join('')}</div>`;
  } else if (state.role === 'tech'){
    const tech = state.tech.techId ? DB.getTech(state.tech.techId) : null;
    sb.innerHTML = tech
      ? `<span class="who">Logged in as <b>${tech.name}</b></span><button class="link-btn" style="margin-left:auto" onclick="switchTech()">Switch tech</button>`
      : `<span class="who">Select a technician to continue</span>`;
  } else {
    const prop = state.client.propertyId ? DB.getProperty(state.client.propertyId) : null;
    sb.innerHTML = prop
      ? `<span class="who">Viewing <b>${prop.nickname}</b></span><button class="link-btn" style="margin-left:auto" onclick="switchProperty()">Switch property</button>`
      : `<span class="who">Select a property to continue</span>`;
  }
}

/* ===================================================================
   ADMIN
   =================================================================== */
function setAdminView(view, id){
  state.admin.view = view;
  if (view === 'property-detail') state.admin.propertyId = id;
  if (view === 'job-detail') state.admin.jobId = id;
  if (view === 'inquiry-detail') state.admin.inquiryId = id;
  if (view === 'new-property') { state.admin.convertingInquiryId = null; initPropertyDraft(); }
  render();
}

function renderAdmin(){
  switch(state.admin.view){
    case 'properties': return renderAdminProperties();
    case 'property-detail': return renderAdminPropertyDetail();
    case 'new-property': return renderNewPropertyForm();
    case 'jobs': return renderAdminJobs();
    case 'job-detail': return renderJobDetail('admin');
    case 'new-job': return renderNewJobForm();
    case 'techs': return renderAdminTechs();
    case 'new-tech': return renderNewTechForm();
    case 'resources': return renderAdminResources();
    case 'inquiries': return renderAdminInquiries();
    case 'inquiry-detail': return renderAdminInquiryDetail();
    case 'new-inquiry': return renderNewInquiryForm();
    default: return renderAdminOverview();
  }
}

function renderAdminOverview(){
  const jobs = DB.getJobs();
  const props = DB.getProperties();
  const openFlags = jobs.reduce((n,j) => n + j.issueFlags.filter(f=>f.severity!=='routine').length, 0);
  const inProg = jobs.filter(j=>j.status==='in_progress').length;
  const doneToday = jobs.filter(j=>j.status==='complete' && j.scheduledDate===todayStr()).length;
  const inqs = DB.getInquiries();
  const newInq = inqs.filter(q => q.status === 'new').length;
  const dueInq = inqs.filter(q => INQ_OPEN.includes(q.status) && q.followUp && q.followUp <= todayStr()).length;
  return `
    <h1>Overview</h1>
    <p class="accent" style="margin:6px 0 20px;">A live look at every lead, property, and job, today.</p>
    <div class="grid-stats">
      <div class="stat" style="cursor:pointer;" onclick="setAdminView('inquiries')"><div class="num">${newInq}</div><div class="lbl">New Inquiries</div></div>
      <div class="stat" style="cursor:pointer;" onclick="setAdminView('inquiries')"><div class="num" style="${dueInq?'color:var(--urgent)':''}">${dueInq}</div><div class="lbl">Follow-ups Due</div></div>
      <div class="stat"><div class="num">${props.length}</div><div class="lbl">Properties</div></div>
      <div class="stat"><div class="num">${jobs.length}</div><div class="lbl">Total Jobs</div></div>
      <div class="stat"><div class="num">${inProg}</div><div class="lbl">In Progress</div></div>
      <div class="stat"><div class="num">${doneToday}</div><div class="lbl">Completed Today</div></div>
      <div class="stat"><div class="num" style="${openFlags?'color:var(--urgent)':''}">${openFlags}</div><div class="lbl">Open Flags</div></div>
    </div>
    <h2 style="margin-bottom:10px;">Recent Job Activity</h2>
    ${jobs.slice(0,5).map(j => jobRowHtml(j, 'admin')).join('') || emptyHtml('No jobs yet')}
  `;
}

function submitNewProperty(){
  const d = newPropertyDraft;
  const nickname = d.nickname.trim();
  const street = d.street.trim();
  if (!nickname || !street) return;
  const bedrooms = parseInt(d.bedrooms) || 0;
  const bathrooms = parseInt(d.bathrooms) || 1;
  const address = [street, d.city, [d.state, d.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  const prop = {
    id: 'p' + Date.now(),
    ...d,
    nickname, address, bedrooms, bathrooms,
    platforms: d.platforms.length ? d.platforms : ['Airbnb'],
    sopTemplate: buildSopTemplate(bedrooms, d.hasOutdoor)
  };
  DB.saveProperty(prop);
  if (state.admin.convertingInquiryId) {
    DB.linkInquiryToProperty(state.admin.convertingInquiryId, prop.id, nickname);
    state.admin.convertingInquiryId = null;
  }
  newPropertyDraft = null;
  setAdminView('property-detail', prop.id);
}

   INQUIRIES — lead pipeline: New → Contacted → Qualified → Converted (or Not a Fit)

const INQ_STAGES = [['new','New'],['contacted','Contacted'],['qualified','Qualified'],['converted','Converted'],['not_a_fit','Not a Fit']];
const INQ_LABELS = Object.fromEntries(INQ_STAGES);
const INQ_OPEN = ['new','contacted','qualified'];
const INQ_SERVICES = ['STR / Airbnb Make-Ready & Turnover','General Home Prep Cleaning','Move-In / Move-Out Prep','Vacant Property Inspections','Light Repairs & Touch-Ups','Exterior Refresh & Curb Appeal'];
const INQ_SOURCES = ['Website form','Phone call','Text message','Instagram / Facebook DM','Referral','Nextdoor','Email outreach','Other'];
const INQ_PROPTYPES = ['Short-term rental / Airbnb','Long-term rental','Owner-occupied home','Vacant / investment property','Other'];
const INQ_FREQ = ['Every turnover (STR)','Weekly','Bi-weekly','Monthly','One-time','Not sure yet'];
const INQ_TIMELINE = ['As soon as possible','Within a week','Within a month','Just gathering quotes'];

// Inquiry text comes from outside (web leads, DMs), so it is always HTML-escaped before display.
function escHtml(x){
  return (x === undefined || x === null ? '' : String(x))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function ageLabel(iso){
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}
function inquiryMatches(q, term){
  if (!term) return true;
  return [q.name, q.phone, q.email, q.address, q.message, q.referenceId, (q.services || []).join(' ')]
    .join(' ').toLowerCase().includes(term.toLowerCase());
}
function inquiryCardHtml(q){
  const isOpen = INQ_OPEN.includes(q.status);
  const waiting = q.status === 'new' && (Date.now() - new Date(q.createdAt).getTime()) > 24*3600*1000;
  const fuDue = isOpen && q.followUp && q.followUp <= todayStr();
  const fuLine = fuDue
    ? `<div style="font-size:12.5px; color:var(--urgent); font-weight:700; margin-top:4px;">Follow-up due ${fmtDate(q.followUp)}</div>`
    : (isOpen && q.followUp ? `<div style="font-size:12.5px; color:var(--slate); margin-top:4px;">Follow-up ${fmtDate(q.followUp)}</div>` : '');
  return `
    <div class="card" style="cursor:pointer;" onclick="setAdminView('inquiry-detail','${q.id}')">
      <div class="row between">
        <div>
          <div style="font-weight:700; color:var(--navy);">${escHtml(q.name)} <span style="font-weight:400; color:var(--slate); font-size:13px;">· ${escHtml((q.services || []).join(', ') || 'No service selected')}</span></div>
          <div style="font-size:13px; color:var(--slate); margin-top:2px;">${escHtml(q.address || 'No address yet')} · ${escHtml(q.source || '—')} · <span style="${waiting ? 'color:var(--urgent); font-weight:700;' : ''}">${ageLabel(q.createdAt)}</span></div>
          ${fuLine}
        </div>
        <span class="badge q_${q.status}">${INQ_LABELS[q.status]}</span>
      </div>
    </div>`;
}
function inquiryListHtml(){
  const f = state.admin.inquiryFilter, term = state.admin.inquirySearch;
  const list = DB.getInquiries().filter(q => (f === 'all' || q.status === f) && inquiryMatches(q, term));
  return list.map(inquiryCardHtml).join('') || emptyHtml(term || f !== 'all' ? 'No inquiries match' : 'No inquiries yet');
}

function submitNewInquiry(){

  if (!name || (!phone && !email)) {

    err.style.display = 'block';
    return;
  }
  const num = id => { const x = v(id); return x === '' ? '' : Number(x); };
  const inq = DB.addInquiry({
    name, phone, email, source: v('ni-source'),
    services: [...document.querySelectorAll('.ni-svc:checked')].map(c => c.value),
    address: v('ni-address'), propertyType: v('ni-ptype'), frequency: v('ni-freq'), timeline: v('ni-timeline'),
    bedrooms: num('ni-beds'), bathrooms: num('ni-baths'), followUp: v('ni-followup'), message: v('ni-message')
  });
  setAdminView('inquiry-detail', inq.id);
}

// Hands the lead's details to the existing New Property form. The inquiry is only marked Converted
// when that property is actually saved (see submitNewProperty), so abandoning the form changes nothing.
function convertInquiry(id){
  const q = DB.getInquiry(id);
  if (!q) return;
  initPropertyDraft();
  const d = newPropertyDraft;
  const parts = (q.address || '').split(',').map(x => x.trim()).filter(Boolean);
  if (parts.length >= 3) {
    d.street = parts[0]; d.city = parts[1];
    const m = parts.slice(2).join(' ').match(/^([A-Za-z]{2})\b\s*(\d{5})?/);
    if (m) { d.state = m[1].toUpperCase(); d.zip = m[2] || ''; }
  } else if (parts.length === 2) { d.street = parts[0]; d.city = parts[1]; }
  else if (parts.length === 1) { d.street = parts[0]; }
  d.hostName = q.name || '';
  d.hostPhone = q.phone || '';
  d.hostEmail = q.email || '';
  if (q.bedrooms !== '' && q.bedrooms != null) d.bedrooms = q.bedrooms;
  if (q.bathrooms !== '' && q.bathrooms != null) {
    d.bathrooms = Math.floor(q.bathrooms);
    if (q.bathrooms % 1 !== 0) d.halfBaths = 1;
  }
  if (q.message) d.additionalNotes = 'From inquiry ' + q.referenceId + ': ' + q.message;
  state.admin.convertingInquiryId = id;
  state.admin.view = 'new-property';
  render();
}

// CSV cells are quoted, and text that could be read as a spreadsheet formula is neutralized.
function csvCell(v){
  let t = v === undefined || v === null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(t) && !/^[+-]?[\d\s().-]+$/.test(t)) t = "'" + t;
  return '"' + t.replace(/"/g, '""') + '"';
}
function exportInquiriesCsv(){
  const cols = ['Reference','Received','Status','Name','Phone','Email','Services','Property Type','Address','Bedrooms','Bathrooms','Frequency','Timeline','Source','Follow-up','Message'];
  const rows = DB.getInquiries().map(r => [r.referenceId, r.createdAt, INQ_LABELS[r.status], r.name, r.phone, r.email, (r.services || []).join('; '),
    r.propertyType, r.address, r.bedrooms, r.bathrooms, r.frequency, r.timeline, r.source, r.followUp, r.message]);
  const csv = [cols].concat(rows).map(row => row.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'inquiries-' + todayStr() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

      <select id="nj-property">${props.map(p=>`<option value="${p.id}">${p.nickname}</option>`).join('')}</select>
      <div class="form-grid">
        <div>
          <label class="field">Service Type</label>
          <select id="nj-type"><option>Turnover</option><option>General Services</option></select>
        </div>
        <div>
          <label class="field">Assign To</label>
          <select id="nj-tech">${techs.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
        </div>
      </div>
      <label class="field">Scheduled Date</label>
      <input type="date" id="nj-date" value="${todayStr()}">
      <div style="margin-top:18px;">
        <button class="btn btn-primary" onclick="submitNewJob()">Create Job</button>
      </div>
    </div>
  `;
}

function submitNewJob(){
  const propertyId = document.getElementById('nj-property').value;
  const type = document.getElementById('nj-type').value;
  const techId = document.getElementById('nj-tech').value;
  const scheduledDate = document.getElementById('nj-date').value;
  const job = DB.createJob({propertyId, techId, type, scheduledDate});
  setAdminView('job-detail', job.id);
}

/* ===================================================================
   TECH
   =================================================================== */
function switchTech(){ state.tech.techId = null; state.tech.view='myjobs'; render(); }
function selectTech(id){ state.tech.techId = id; render(); }

function renderTech(){
  if (!state.tech.techId) return renderTechSelect();
  if (state.tech.view === 'job-detail') return renderJobDetail('tech');
  return renderTechMyJobs();
}

function renderTechSelect(){
  const techs = DB.getTechs();
  return `
    <h1>Who's clocking in?</h1>
    <p class="accent" style="margin:6px 0 16px;">Select your name to see today's assignments.</p>
    <div class="select-grid">
      ${techs.map(t => `<button class="select-card" onclick="selectTech('${t.id}')" style="cursor:pointer;">
        <div style="font-weight:700; color:var(--navy); font-size:16px;">${t.name}</div>
        <div style="font-size:12.5px; color:var(--slate); margin-top:4px;">${DB.getJobs({techId:t.id, status:'not_started'}).length} jobs waiting</div>
      </button>`).join('')}
    </div>
  `;
}

function renderTechMyJobs(){
  const jobs = DB.getJobs({techId: state.tech.techId});
  const open = jobs.filter(j=>j.status!=='complete');
  const done = jobs.filter(j=>j.status==='complete');
  return `
    <h1>My Jobs</h1>
    <p class="accent" style="margin:6px 0 16px;">Today's assignments, in order.</p>
    ${open.map(j => jobRowHtml(j,'tech')).join('') || emptyHtml('No open jobs — you\'re all caught up')}
    ${done.length ? `<h3 class="label" style="margin-top:26px;">Completed</h3>${done.map(j=>jobRowHtml(j,'tech')).join('')}` : ''}
  `;
}

/* ===================================================================
   CLIENT
   =================================================================== */
function switchProperty(){ state.client.propertyId = null; state.client.view='current'; render(); }
function selectProperty(id){ state.client.propertyId = id; render(); }
function setClientView(view, jobId){ state.client.view = view; if(jobId) state.client.jobId = jobId; render(); }

function renderClient(){
  if (!state.client.propertyId) return renderClientSelect();
  if (state.client.view === 'job-detail') return renderJobDetail('client');
  if (state.client.view === 'history') return renderClientHistory();
  return renderClientCurrent();
}

function renderClientSelect(){
  const props = DB.getProperties();
  return `
    <h1>Whose dashboard?</h1>
    <p class="accent" style="margin:6px 0 16px;">Select a property to view its live turnover status.</p>
    <div class="select-grid">
      ${props.map(p => `<button class="select-card" onclick="selectProperty('${p.id}')" style="cursor:pointer;">
        <div style="font-weight:700; color:var(--navy); font-size:16px;">${p.nickname}</div>
        <div style="font-size:12.5px; color:var(--slate); margin-top:4px;">${p.address}</div>
      </button>`).join('')}
    </div>
  `;
}

function renderClientCurrent(){
  const jobs = DB.getJobs({propertyId: state.client.propertyId});
  const current = jobs.find(j => j.status !== 'complete') || jobs[0];
  return `
    <div class="row between"><h1>Your Dashboard</h1>
      <button class="link-btn" onclick="setClientView('history')">Job History →</button>
    </div>
    <p class="accent" style="margin:6px 0 16px;">Every task checked off. Every room photographed. Every issue flagged.</p>
    ${current ? clientJobCardHtml(current) : emptyHtml('No turnovers scheduled yet')}
  `;
}

function renderClientHistory(){
  const jobs = DB.getJobs({propertyId: state.client.propertyId, status:'complete'});
  return `
    <button class="backlink" onclick="setClientView('current')">← Back to live status</button>
    <h1>Job History</h1>
    <p class="accent" style="margin:6px 0 16px;">Your complete property record, always accessible.</p>
    ${jobs.map(j=>jobRowHtml(j,'client')).join('') || emptyHtml('No completed jobs yet')}
  `;
}

function clientJobCardHtml(job){
  const prop = DB.getProperty(job.propertyId);
  const doneCount = job.tasks.filter(t=>t.done).length;
  return `
  <div class="card">
    <div class="row between">
      <div>
        <h3 class="label">${job.type} · ${fmtDate(job.scheduledDate)}</h3>
        <div style="font-size:13px; color:var(--slate);">${prop.nickname}</div>
      </div>
      ${statusBadgeHtml(job.status)}
    </div>
    <div style="margin:14px 0; font-size:13.5px; color:var(--slate);">${doneCount} of ${job.tasks.length} tasks complete</div>
    <button class="btn btn-outline btn-sm" onclick="setClientView('job-detail','${job.id}')">View Live Detail</button>
  </div>`;
}

/* ===================================================================
   SHARED: job list row + job detail (role-aware)
   =================================================================== */
function statusBadgeHtml(status){
  const labels = {not_started:'Not Started', in_progress:'In Progress', complete:'Complete'};
  const dot = status==='in_progress' ? '<span class="dot pulse"></span>' : '';
  return `<span class="badge ${status}">${dot}${labels[status]}</span>`;
}

function jobRowHtml(job, ctx){
  const prop = DB.getProperty(job.propertyId);
  const tech = DB.getTech(job.techId);
  const doneCount = job.tasks.filter(t=>t.done).length;
  const flagBadge = job.issueFlags.length
    ? `<span class="sev ${job.issueFlags.some(f=>f.severity==='urgent')?'urgent':(job.issueFlags.some(f=>f.severity==='attention')?'attention':'routine')}">${job.issueFlags.length} flag${job.issueFlags.length>1?'s':''}</span>`
    : '';
  const openFn = `set${ctx==='admin'?'AdminView':(ctx==='tech'?'TechView_unused':'ClientView')}`;
  const onclick = ctx==='admin' ? `setAdminView('job-detail','${job.id}')`
    : ctx==='tech' ? `openTechJob('${job.id}')`
    : `setClientView('job-detail','${job.id}')`;
  return `
    <div class="card" style="cursor:pointer;" onclick="${onclick}">
      <div class="row between">
        <div>
          <div style="font-weight:700; color:var(--navy);">${prop.nickname} <span style="font-weight:400; color:var(--slate); font-size:13px;">· ${job.type}</span></div>
          <div style="font-size:13px; color:var(--slate); margin-top:2px;">${fmtDate(job.scheduledDate)}${ctx!=='tech' ? ' · '+tech.name : ''} · ${doneCount}/${job.tasks.length} tasks</div>
        </div>
        <div class="row" style="gap:8px;">${flagBadge}${statusBadgeHtml(job.status)}</div>
      </div>
    </div>
  `;
}

function openTechJob(jobId){ state.tech.view='job-detail'; state.tech.jobId=jobId; render(); }

function emptyHtml(msg){
  return `<div class="empty"><span class="accent">${msg}</span></div>`;
}

function currentJobIdForRole(role){
  if (role==='admin') return state.admin.jobId;
  if (role==='tech') return state.tech.jobId;
  return state.client.jobId;
}
function backForRole(role){
  if (role==='admin') setAdminView('jobs');
  else if (role==='tech'){ state.tech.view='myjobs'; render(); }
  else setClientView('current');
}

function renderJobDetail(role){
  const jobId = currentJobIdForRole(role);
  const job = DB.getJob(jobId);
  const prop = DB.getProperty(job.propertyId);
  const tech = DB.getTech(job.techId);
  const sections = [...new Set(job.tasks.map(t=>t.section))];
  const isTech = role==='tech';
  const isClient = role==='client';
  const areas = propertyAreas(prop);
  const beforeDone = areas.every(a => job.beforePhotos[a]);
  const afterDone = areas.every(a => job.afterPhotos[a]);
  const doneCount = job.tasks.filter(t=>t.done).length;
  const allTasksDone = job.tasks.length > 0 && doneCount === job.tasks.length;
  const canWork = isTech && !!job.clockIn && beforeDone;
  const canSignOff = allTasksDone && afterDone;

  return `
    <button class="backlink" onclick="backForRole('${role}')">← Back</button>
    <div class="row between">
      <div>
        <h1>${prop.nickname}</h1>
        <p class="accent" style="margin:4px 0 0;">${job.type} · ${fmtDate(job.scheduledDate)} · ${tech.name}</p>
      </div>
      ${statusBadgeHtml(job.status)}
    </div>

    <div class="card">
      <div class="row" style="gap:24px; font-size:13.5px; color:var(--slate); flex-wrap:wrap;">
        <div>Clock In: <b style="color:var(--ink);">${fmtDateTime(job.clockIn)}</b></div>
        <div>Clock Out: <b style="color:var(--ink);">${fmtDateTime(job.clockOut)}</b></div>
        <div>${doneCount} / ${job.tasks.length} tasks complete</div>
      </div>
      ${isTech && job.status==='not_started' ? `<div style="margin-top:14px;"><button class="btn btn-primary" onclick="doClockIn('${job.id}')">Clock In &amp; Start Job</button></div>` : ''}
      ${isTech && job.clockIn && !beforeDone ? `<p style="margin-top:10px; font-size:13px; color:var(--urgent);">Take before photos of every room below — before touching anything — no exceptions. The checklist unlocks once they're all in.</p>` : ''}
    </div>

    ${isTech ? `
      <div class="card" style="border-left:4px solid var(--navy);">
        <h3 class="label">Access Info — Tech Only</h3>
        <div style="font-size:13.5px; line-height:1.8;">
          ${prop.keyMethod ? `<div><span style="color:var(--slate);">Key Method:</span> <b>${prop.keyMethod}</b></div>` : ''}
          ${prop.entryCode ? `<div><span style="color:var(--slate);">Entry Code:</span> <b>${prop.entryCode}</b></div>` : ''}
          ${prop.garageCode ? `<div><span style="color:var(--slate);">Garage Code:</span> <b>${prop.garageCode}</b></div>` : ''}
          ${prop.gateCode ? `<div><span style="color:var(--slate);">Gate Code:</span> <b>${prop.gateCode}</b></div>` : ''}
          ${prop.parkingInstructions ? `<div><span style="color:var(--slate);">Parking:</span> ${prop.parkingInstructions}</div>` : ''}
          ${prop.accessNotes ? `<div style="margin-top:4px;">${prop.accessNotes}</div>` : ''}
          ${!prop.keyMethod && !prop.entryCode ? `<div style="color:var(--slate);">No access details on file — check with your coordinator.</div>` : ''}
        </div>
      </div>
    ` : ''}

    ${job.completionReport ? `
      <div class="card" style="border-left:4px solid var(--gold);">
        <h3 class="label">Completion Report</h3>
        <p class="accent" style="font-size:16px;">Every detail matters — this property is guest-ready.</p>
        <div style="font-size:13.5px; color:var(--slate);">Signed off ${fmtDateTime(job.completionReport.signOffAt)} · ${job.completionReport.photoCount} photos logged · ${job.completionReport.flagCount} issue flag(s)</div>
        ${job.completionReport.notes ? `<p style="margin-top:8px; font-size:14px;">${job.completionReport.notes}</p>` : ''}
      </div>
    ` : ''}

    ${job.issueFlags.length ? `
      <div class="card">
        <h3 class="label">Issue Flags</h3>
        ${job.issueFlags.map(f => `
          <div class="flag-card ${f.severity}">
            <div class="row between"><span class="sev ${f.severity}">${sevLabel(f.severity)}</span><span style="font-size:11.5px; color:var(--slate);">${fmtDateTime(f.createdAt)}</span></div>
            <p style="margin-top:6px; font-size:14px;">${f.description}</p>
            ${f.photo ? `<img class="thumb" src="${f.photo}" style="margin-top:4px;">` : ''}
          </div>
        `).join('')}
      </div>
    ` : ''}

    ${isTech ? `
      <div class="card">
        <h3 class="label">Flag an Issue</h3>
        <select id="flag-sev-${job.id}" onchange="updateFlagHint('${job.id}')">
          <option value="routine">Routine Note</option>
          <option value="attention">Needs Host Attention</option>
          <option value="urgent">Urgent — Stop and Call</option>
        </select>
        <p id="flag-hint-${job.id}" style="display:none; font-size:12.5px; color:var(--urgent); font-weight:700; margin:6px 0 0;">Stop. Don't just flag this — call your supervisor immediately.</p>
        <div class="row" style="gap:6px; margin-top:10px;">
          ${DAMAGE_TAGS.map(tag => `<button type="button" class="btn btn-outline btn-sm" style="padding:5px 10px; font-size:11.5px;" onclick="appendFlagChip('${job.id}','${tag}')">${tag}</button>`).join('')}
        </div>
        <textarea id="flag-desc-${job.id}" rows="2" placeholder="Describe what you found and exactly where…" style="margin-top:10px;"></textarea>
        <div class="row" style="margin-top:10px; gap:12px;">
          <label class="photo-slot" for="flag-photo-${job.id}">+ photo</label>
          <input type="file" accept="image/*" capture="environment" id="flag-photo-${job.id}" onchange="handleFlagPhoto(event,'${job.id}')">
          <div id="flag-photo-preview-${job.id}"></div>
          <button class="btn btn-outline btn-sm" onclick="submitFlag('${job.id}')">Submit Flag</button>
        </div>
      </div>
    ` : ''}

    ${(job.clockIn) ? `
      <div class="card">
        <h3 class="label">Before Photos — Arrival</h3>
        <p style="font-size:12.5px; color:var(--slate); margin-bottom:6px;">Taken immediately on arrival, before anything is touched.</p>
        ${areaPhotoGridHtml(job, 'before', areas, isTech)}
      </div>
    ` : ''}

    ${isTech && job.clockIn ? `
      <div class="card">
        <div class="row between" style="cursor:pointer;" onclick="doToggleLaundry('${job.id}')">
          <h3 class="label" style="margin:0;">Laundry Started</h3>
          <div class="task-check ${job.laundryStarted?'done':''}">${job.laundryStarted?'✓':''}</div>
        </div>
      </div>
    ` : ''}

    <div class="card">
      <h3 class="label">Checklist${isClient ? ' — Live Feed' : ''}</h3>
      ${isTech && job.clockIn && !canWork ? `<p style="font-size:13px; color:var(--slate); margin-bottom:8px;">🔒 Finish the before photos above to start checking off tasks.</p>` : ''}
      ${sections.map(sec => `
        <div class="section-hdr">${sec}</div>
        ${job.tasks.filter(t=>t.section===sec).map(t => taskRowHtml(t, job, canWork)).join('')}
      `).join('')}
    </div>

    ${(allTasksDone) ? `
      <div class="card">
        <h3 class="label">After Photos — Final Walkthrough</h3>
        <p style="font-size:12.5px; color:var(--slate); margin-bottom:6px;">Taken after the final walkthrough — proof of completion.</p>
        ${areaPhotoGridHtml(job, 'after', areas, isTech)}
      </div>
    ` : (isTech ? `<div class="card"><h3 class="label">After Photos — Final Walkthrough</h3><p style="font-size:13px; color:var(--slate);">🔒 Complete every checklist task first.</p></div>` : '')}

    ${isTech && job.status!=='complete' ? `
      <div class="card">
        <h3 class="label">Final Sign-Off</h3>
        ${!canSignOff ? `<p style="font-size:13px; color:var(--slate);">Complete all tasks and upload every after photo to submit sign-off.</p>` : ''}
        <textarea id="signoff-notes-${job.id}" rows="2" placeholder="Any notes for the host? (optional)"></textarea>
        <div style="margin-top:10px;"><button class="btn btn-gold" ${canSignOff?'':'disabled'} onclick="doSignOff('${job.id}')">Submit Sign-Off &amp; Clock Out</button></div>
      </div>
    ` : ''}
  `;
}

const DAMAGE_TAGS = ['Broken furniture','Damaged linens/towels','Broken dishes/glassware','Damaged appliance',
  'Wall damage','Floor damage','Broken fixture','Missing inventory','Evidence of pets','Evidence of smoking',
  'Excessive mess','Plumbing / leak','Pest evidence','Exterior damage'];

function sevLabel(sev){
  return sev==='urgent' ? 'Urgent — Stop and Call' : sev==='attention' ? 'Needs Host Attention' : 'Routine Note';
}

function areaPhotoGridHtml(job, phase, areas, editable){
  const map = phase==='before' ? job.beforePhotos : job.afterPhotos;
  return `<div class="thumb-row">` + areas.map(a => {
    const url = map[a];
    const cell = url
      ? `<img class="thumb" src="${url}">`
      : (editable ? areaPhotoSlotHtml(job.id, a, phase) : `<div class="photo-slot" style="opacity:.5; border-style:solid;">—</div>`);
    return `<div style="text-align:center;">${cell}<div style="font-size:10px; color:var(--slate); margin-top:3px; max-width:66px;">${a}</div></div>`;
  }).join('') + `</div>`;
}
function areaPhotoSlotHtml(jobId, area, phase){
  const inputId = `areaphoto-${jobId}-${area.replace(/[^a-zA-Z0-9]/g,'_')}-${phase}`;
  return `<label class="photo-slot" for="${inputId}">+ photo</label>
    <input type="file" accept="image/*" capture="environment" id="${inputId}" onchange="handleAreaPhotoUpload(event,'${jobId}','${area}','${phase}')">`;
}

function taskRowHtml(t, job, canWork){
  return `
    <div class="task-row">
      <div class="task-check ${t.done?'done':''}" ${canWork?`onclick="doToggleTask('${job.id}','${t.id}')"`:''} style="${canWork?'cursor:pointer;':''}">${t.done?'✓':''}</div>
      <div style="flex:1;">
        <div class="task-text ${t.done?'done':''}">${t.label}</div>
        ${t.doneAt ? `<div class="task-meta">Checked off ${fmtDateTime(t.doneAt)}</div>` : ''}
        <div class="thumb-row">
          ${t.photoBefore ? `<img class="thumb" src="${t.photoBefore}">` : (canWork ? photoSlotHtml(job.id,t.id,'before') : '')}
          ${t.photoAfter ? `<img class="thumb" src="${t.photoAfter}">` : (canWork ? photoSlotHtml(job.id,t.id,'after') : '')}
        </div>
      </div>
    </div>
  `;
}

function photoSlotHtml(jobId, taskId, kind){
  const inputId = `photo-${jobId}-${taskId}-${kind}`;
  return `
    <label class="photo-slot" for="${inputId}">+ ${kind}</label>
    <input type="file" accept="image/*" capture="environment" id="${inputId}" onchange="handlePhotoUpload(event,'${jobId}','${taskId}','${kind}')">
  `;
}

/* ---------------------------- ACTIONS ---------------------------- */
let pendingFlagPhoto = {};

function doClockIn(jobId){ DB.clockIn(jobId); render(); }
function doToggleTask(jobId, taskId){ DB.toggleTask(jobId, taskId); render(); }
function doToggleLaundry(jobId){ DB.toggleLaundry(jobId); render(); }

function appendFlagChip(jobId, label){
  const ta = document.getElementById(`flag-desc-${jobId}`);
  if (!ta) return;
  ta.value = ta.value.trim() ? ta.value.trim() + '; ' + label : label;
  ta.focus();
}
function updateFlagHint(jobId){
  const sev = document.getElementById(`flag-sev-${jobId}`).value;
  const hint = document.getElementById(`flag-hint-${jobId}`);
  if (hint) hint.style.display = sev==='urgent' ? 'block' : 'none';
}
function handleFlagPhoto(evt, jobId){
  const file = evt.target.files[0];
  if (!file) return;
  resizeImageFile(file, 700, dataUrl => {
    pendingFlagPhoto[jobId] = dataUrl;
    const preview = document.getElementById(`flag-photo-preview-${jobId}`);
    if (preview) preview.innerHTML = `<img class="thumb" src="${dataUrl}">`;
  });
}

function submitFlag(jobId){
  const sev = document.getElementById(`flag-sev-${jobId}`).value;
  const desc = document.getElementById(`flag-desc-${jobId}`).value.trim();
  if (!desc) return;
  DB.addIssueFlag(jobId, {severity: sev, description: desc, photoDataUrl: pendingFlagPhoto[jobId]||null});
  delete pendingFlagPhoto[jobId];
  render();
}

function doSignOff(jobId){
  const notes = document.getElementById(`signoff-notes-${jobId}`).value.trim();
  DB.submitSignOff(jobId, {notes});
  render();
}

function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim){ h = Math.round(h*(maxDim/w)); w = maxDim; }
      else if (h > maxDim){ w = Math.round(w*(maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handlePhotoUpload(evt, jobId, taskId, kind){
  const file = evt.target.files[0];
  if (!file) return;
  resizeImageFile(file, 900, dataUrl => { DB.addPhoto(jobId, taskId, kind, dataUrl); render(); });
}

function handleAreaPhotoUpload(evt, jobId, area, phase){
  const file = evt.target.files[0];
  if (!file) return;
  resizeImageFile(file, 900, dataUrl => { DB.setAreaPhoto(jobId, area, phase, dataUrl); render(); });
}

/* ---------------------------- BOOT ---------------------------- */
seed();
render();
</script>
